<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number buttons test</title>
<style>
  :root { --bg:#f6f4fb; --ink:#201a33; --accent:#7360f2; --green:#1f9d55; --muted:#6b6485; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1626; --ink:#f1eefb; --muted:#a49cc0; }
  }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:420px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:1.4rem; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 20px; line-height:1.45; }
  a.btn { display:block; text-align:center; text-decoration:none; color:#fff;
    background:var(--accent); padding:16px; border-radius:12px; font-size:1.05rem;
    font-weight:600; margin-bottom:12px; }
  a.call { background:var(--green); }
  a.alt { background:transparent; color:var(--accent); border:2px solid var(--accent); }
  a.btn:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  small { color:var(--muted); display:block; margin-top:20px; line-height:1.4; }
</style>
</head>
<body>
<main>
  <h1>+960 934 3384</h1>
  <p>Open this page on your phone and tap a button.</p>

  <a class="btn call" href="tel:+9609343384">Call number</a>
  <a class="btn" href="viber://chat?number=%2B9609343384">Open Viber chat</a>
  <a class="btn alt" href="viber://add?number=9609343384">Add in Viber</a>
  <a class="btn alt" href="https://wa.me/9609343384">Open WhatsApp chat</a>

  <small>Viber and WhatsApp must be installed on the phone.</small>
</main>
</body>
</html>
